


<h1>
    Create an account!
</h1>

<script src="scripts/lib.js"></script>
<script src="scripts/checkCreationForm.js"></script>

<form class="mainForm" name="form1" method="post" action="index.php?bro=account&action=create" onsubmit="return Check()">
    <div>
        <label for="email">Email: </label> 
        <input type="email" id="email" name="email" maxlength="128" required/>
        <p class="error" id="emailError"></p>
    </div>

    <div>
        <label for="uname">User name: </label>
        <input type="text" id="uname" name="name" maxlength="48" required />
        <p class="error" id="unameError"></p>
    </div>

    <div>
        <label for="pswd">Password: </label>
        <input type="password" name="password" minlength="4" maxlength="16" id="pswd" required/>
        <p class="error" id="pswdError"></p>
    </div>

    <div hidden id="cpasswordBox">
        <label for="pswd">Confirm password: </label>
        <input type="password" name="cPassword" minlength="4" maxlength="16"  id="cpswd"/>
        <p class="error" id="cpswdError"></p>
    </div>

    <div>
        <button type="submit">Create</button>
    </div>

</form>
