


<h1>
    Create an account!
</h1>

<script src="scripts/checkCreationForm.js"></script>

<form name="form1" method="post" action="index.php?action=insertAccount" onsubmit="return Check()">
    <div>
        <label for="email">Email: </label> 
        <input type="email" id="email" name="email" required/>
        <p class="error" id="emailError"></p>
    </div>

    <div>
        <label for="uname">User name: </label>
        <input type="text" id="uname" name="userName" required />
        <p class="error" id="nameError"></p>
    </div>

    <div>
        <label for="pswd">Password: </label>
        <input type="password" name="userPassword" minlength="4" maxlength="16"  id="pswd" required/>
        <p class="error" id="passwordError"></p>
    </div>

    <div hidden id="cpasswordBox">
        <label for="pswd">Confirm password: </label>
        <input type="password" name="cPassword" minlength="4" maxlength="16"  id="cpswd"/>
        <p class="error" id="conf"></p>
    </div>

    <div>
        <button type="submit">Create</button>
    </div>

</form>
