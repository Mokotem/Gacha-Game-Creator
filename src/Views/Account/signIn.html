<script src="scripts/signin.js"></script>

<form name="form1" class="main" method="post" action="index.php?bro=account&action=signin" onsubmit="return Check()">

    <div>
        <div>
            <input id="emailRad" type="radio" name="method" value="email" checked onclick="onMailClick()" />
            <label for="emailRad">email</label>
            <input id="idRad" type="radio" name="method" value="idPlayer" onclick="onIdClick()"/>
            <label for="idRad">account id</label>
        </div>

        <input type="email" id="email" name="email" maxlength="128" required/>

        <input type="number" id="idd" name="idPlayer" hidden/>
    </div>

    <div>
        <label for="pswd">Password: </label>
        <input type="password" name="password" minlength="4" maxlength="16"  id="pswd" required/>
        <p class="error" id="passwordError"></p>
    </div>

    <div>
        <button type="submit">Sign in</button>
    </div>

</form>
