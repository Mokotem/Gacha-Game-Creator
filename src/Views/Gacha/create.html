

<h1>
    Create a gacha
</h1>

<script src="scripts/lib.js"></script>
<script src="scripts/checkGachaForm.js"></script>

</script>

<form class="mainForm" name="form1" method="post" action="index.php?bro=gacha&action=uploadGacha" onsubmit="return Check()">
    <div>
        <label for="title">gacha title: </label>
        <input required type="text" name="title" id="title"/>
        <p class="error" id="titleError"></p>
    </div>
    <div>
        <label for="desc">description: </label>
        <textarea id="desc", name="desc"></textarea>
        <p class="error" id="descError"></p>
    </div>
    <div>
        <label for="pull">initial pull price: </label>
        <input type="number" min="1" max="100" value="10" id="pull", name="pullPrice"/>
    </div>

    <div>
        <button type="submit">Create</button>
    </div>
</form>
